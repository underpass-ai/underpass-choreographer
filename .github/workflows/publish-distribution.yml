name: publish-distribution

# The two `publish-crate-*` jobs at the bottom need the repo secret
# `CARGO_REGISTRY_TOKEN` set; without it `cargo publish` fails at the
# upload step. That is acceptable — the rest of the workflow (image
# + chart push) still does its job. Tag pushes (`v*`) trigger the
# crate publish; `workflow_dispatch` deliberately does NOT, so an
# operator hitting "Run workflow" to re-roll an image cannot
# accidentally publish to crates.io.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/underpass-ai/underpass-choreographer
  E2E_RUNNER_IMAGE_NAME: ghcr.io/underpass-ai/underpass-choreographer-e2e-runner
  CHART_NAME: choreographer
  CHART_REGISTRY: oci://ghcr.io/underpass-ai/charts
  CHART_PATH: charts/choreographer
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Tag-only smoke gate: builds the compose stack and runs the
  # full compose e2e-runner end-to-end before any image / chart push.
  # Plain `main` pushes (which roll the `latest` / `main` image tags)
  # skip this on purpose — GitHub Actions treats a skipped `needs` as
  # success, so `publish-image` / `publish-helm-chart` keep firing.
  compose-smoke:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Docker version
        run: docker version

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
        with:
          shared-key: release-smoke

      - name: Run compose stack smoke
        run: bash scripts/ci/e2e-compose.sh

      - name: Upload compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-smoke-logs
          path: tests/e2e/compose.log
          if-no-files-found: ignore

  publish-image:
    needs: [compose-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME != '' && secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short,prefix=sha-

      - name: Extract E2E runner image metadata
        id: meta-e2e-runner
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f
        with:
          images: ${{ env.E2E_RUNNER_IMAGE_NAME }}
          tags: |
            type=raw,value=e2e-latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push E2E runner image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ./tests/e2e/runner.Dockerfile
          push: true
          tags: ${{ steps.meta-e2e-runner.outputs.tags }}
          labels: ${{ steps.meta-e2e-runner.outputs.labels }}

  publish-helm-chart:
    needs: [compose-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Helm
        run: bash scripts/ci/install-helm.sh

      - name: Log in to GitHub Container Registry (OCI for charts)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package Helm chart
        run: |
          mkdir -p dist
          helm package "${CHART_PATH}" --destination dist

      - name: Push Helm chart
        run: |
          for archive in dist/*.tgz; do
            helm push "${archive}" "${CHART_REGISTRY}"
          done

  # crates.io publish for the standalone proto crate. Must land before
  # `publish-crate-mcp` so the registry index has the dep when the MCP
  # crate publishes. Tag-only on purpose — `workflow_dispatch` re-rolls
  # are not allowed to mutate the registry.
  publish-crate-proto:
    needs: [compose-smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.97.1

      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
        with:
          shared-key: publish-crate

      - name: Publish choreo-mcp-proto
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p choreo-mcp-proto --token "${CARGO_REGISTRY_TOKEN}"

  publish-crate-mcp:
    needs: [publish-crate-proto]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.97.1

      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
        with:
          shared-key: publish-crate

      # Give the crates.io index time to propagate the new
      # `choreo-mcp-proto` version before the MCP publish tries to
      # resolve it from the registry.
      - name: Wait for registry propagation
        run: sleep 30

      - name: Publish choreo-mcp
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p choreo-mcp --token "${CARGO_REGISTRY_TOKEN}"
