// Copyright Underpass AI. Licensed under Apache-2.0.
//
// Underpass Choreographer — event-driven coordinator of specialist agent
// councils. Use-case agnostic: no vocabulary from any specific domain
// (software engineering, clinical, supply chain, etc.) is baked in.
//
// Key concepts:
//   - Specialty: a free-form label identifying a kind of expertise
//                (e.g. "triage", "reviewer", "planner"). Defined by the
//                operator, never enumerated by this contract.
//   - Agent:     a participant capable of proposing, critiquing, and
//                revising solutions for a task.
//   - Council:   a group of Agents for a given Specialty that deliberates
//                over a task.
//   - Task:      a unit of work submitted for deliberation; carries a
//                description and structured constraints.
//   - Deliberation: proposal -> peer critique -> revision -> validation
//                   -> scoring -> ranked results.
//   - TriggerEvent: an inbound domain event that instructs the
//                   choreographer to dispatch deliberations across one
//                   or more specialties.
//
// All domain-specific content is carried as opaque, structured data
// (google.protobuf.Struct / map<string, Value>) so any use case can
// attach its own attributes without modifying this contract.

syntax = "proto3";

package underpass.choreo.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// ============================================================================
// Service
// ============================================================================

// Implementation status (server side) at v0.1:
//
// Every RPC is backed by a use case in `choreo-app/src/usecases/`
// (or `services/auto_dispatch.rs` for ProcessTriggerEvent;
// `StatisticsPort::snapshot` for GetStatus / GetMetrics;
// `AgentFactoryPort` + `AgentRegistryPort` for RegisterAgent /
// UnregisterAgent; `DeliberationObserverPort` bridged to an mpsc
// channel for StreamDeliberation).
//
// Caveats the project's honesty principles require to surface:
//
//   RegisterAgent accepts `kind == "noop"` unconditionally. Provider-
//   backed kinds (vLLM, Anthropic, OpenAI, …) are accepted when the
//   binary was compiled with the matching feature and booted with the
//   required provider configuration.
//
//   StreamDeliberation emits one `DeliberationUpdate` per phase
//   transition (Proposing → Revising → Validating → Scoring →
//   Completed) and a final frame carrying the winner
//   `DeliberationResult`. It does not yet emit per-proposal /
//   per-critique / per-revision frames.
service ChoreographerService {
  // ---- Deliberation ----------------------------------------------------

  // Run a deliberation on the council registered for the requested
  // specialty. Blocks until the ranked results are ready.
  rpc Deliberate(DeliberateRequest) returns (DeliberateResponse);

  // Like Deliberate but streams phase updates plus a final winner frame.
  // Per-proposal, per-critique, and per-revision frames are reserved
  // for a later additive slice.
  rpc StreamDeliberation(StreamDeliberationRequest) returns (stream StreamDeliberationResponse);

  // Retrieve a previously-executed deliberation by task id.
  rpc GetDeliberationResult(GetDeliberationResultRequest) returns (GetDeliberationResultResponse);

  // End-to-end orchestration: deliberate AND execute the winning
  // proposal via the configured executor port. Opaque to the
  // choreographer what "execute" means — determined by the adapter.
  rpc Orchestrate(OrchestrateRequest) returns (OrchestrateResponse);

  // ---- Council / Agent registry ---------------------------------------

  rpc CreateCouncil(CreateCouncilRequest) returns (CreateCouncilResponse);
  rpc ListCouncils(ListCouncilsRequest) returns (ListCouncilsResponse);
  rpc DeleteCouncil(DeleteCouncilRequest) returns (DeleteCouncilResponse);

  rpc RegisterAgent(RegisterAgentRequest) returns (RegisterAgentResponse);
  rpc UnregisterAgent(UnregisterAgentRequest) returns (UnregisterAgentResponse);

  // ---- Triggers (generic, replaces ProcessPlanningEvent) --------------

  // Submit a domain event that should fan out to one or more
  // deliberations. Mirrors the behavior of the NATS auto-dispatch path
  // but exposed as a synchronous RPC for callers without a broker.
  rpc ProcessTriggerEvent(ProcessTriggerEventRequest) returns (ProcessTriggerEventResponse);

  // ---- Council decision (Epic 9) --------------------------------------
  //
  // Consumer-facing surface that hands the council a contract and
  // an external-context bundle and returns the *validated* winner.
  // Decoupled from any executor — consumers integrate the runtime
  // separately if they need to act on the decision.

  rpc RunCouncilDecision(RunCouncilDecisionRequest) returns (RunCouncilDecisionResponse);

  // CRUD over the contract registry. Without these the
  // RunCouncilDecision RPC would only accept contracts seeded via
  // CHOREO_CONTRACT_DIR.

  rpc RegisterContract(RegisterContractRequest) returns (RegisterContractResponse);
  rpc ListContracts(ListContractsRequest) returns (ListContractsResponse);
  rpc DeleteContract(DeleteContractRequest) returns (DeleteContractResponse);

  // ---- Declarative ceremonies ----------------------------------------

  // Execute a declarative ceremony definition supplied as YAML.
  // This is the public surface for the extracted ceremony engine:
  // the YAML is parsed into the domain definition, the application
  // use case runs the guarded state machine, and the response carries
  // both execution trace and a Mermaid sequence diagram.
  rpc RunCeremony(RunCeremonyRequest) returns (RunCeremonyResponse);

  // Read a live ceremony without advancing it. The response is the
  // same view the embedded distribution exposes, so a client sees one
  // working session whichever way it reached the engine.
  rpc GetCeremonyInstance(GetCeremonyInstanceRequest) returns (GetCeremonyInstanceResponse);
  rpc ListCeremonyInstances(ListCeremonyInstancesRequest) returns (ListCeremonyInstancesResponse);

  // Advance a ceremony one move at a time. RunCeremony above runs a
  // whole session in a single call, which is right for a ceremony that
  // needs nobody; these are for one that does. Every one of them
  // answers with the instance as it stands afterwards, so a caller
  // never has to follow a mutation with a read to learn what changed.
  rpc StartCeremony(StartCeremonyRequest) returns (StartCeremonyResponse);
  rpc StartPublishedCeremony(StartPublishedCeremonyRequest) returns (StartPublishedCeremonyResponse);
  rpc RunCeremonyStep(RunCeremonyStepRequest) returns (RunCeremonyStepResponse);
  rpc ApplyCeremonyTransition(ApplyCeremonyTransitionRequest) returns (ApplyCeremonyTransitionResponse);

  // The part of a working session that only a person can do. A guard
  // is approved or deferred, an agenda item is opened, answered and
  // closed, evidence is gathered against it. These are what make a
  // session something an engineer takes part in rather than watches,
  // and they answer with the session exactly as the moves above do.
  rpc ApproveCeremonyGuard(ApproveCeremonyGuardRequest) returns (ApproveCeremonyGuardResponse);
  rpc DeferCeremonyGuard(DeferCeremonyGuardRequest) returns (DeferCeremonyGuardResponse);
  rpc RequestCeremonyIntervention(RequestCeremonyInterventionRequest) returns (RequestCeremonyInterventionResponse);
  rpc RespondToCeremonyIntervention(RespondToCeremonyInterventionRequest) returns (RespondToCeremonyInterventionResponse);
  rpc CloseCeremonyIntervention(CloseCeremonyInterventionRequest) returns (CloseCeremonyInterventionResponse);
  rpc CollectCeremonyEvidence(CollectCeremonyEvidenceRequest) returns (CollectCeremonyEvidenceResponse);
  // Saying why one thing this session produced led to another. Its own
  // call rather than a field on contributing, because understanding
  // usually arrives afterwards — "in fact I did that because…" is how
  // people reason, and a field gets filled in by inertia where a call
  // is chosen.
  rpc AssertCeremonyReason(AssertCeremonyReasonRequest) returns (AssertCeremonyReasonResponse);

  // Authoring. A draft is checked and explained before it is put in
  // the catalogue, and publishing is what makes a version something
  // an instance can be bound to. Validate and explain touch nothing:
  // they answer about the YAML in the request and leave no trace.
  rpc ValidateCeremonyDraft(ValidateCeremonyDraftRequest) returns (ValidateCeremonyDraftResponse);
  rpc ExplainCeremonyDraft(ExplainCeremonyDraftRequest) returns (ExplainCeremonyDraftResponse);
  rpc PublishCeremonyDefinition(PublishCeremonyDefinitionRequest) returns (PublishCeremonyDefinitionResponse);
  // Compare two definitions and say what changed — and, for each
  // change, whether a session already running the earlier one could
  // go on. "What changed" is answerable by reading both documents;
  // "can the meeting happening right now still finish" is not.
  rpc DiffCeremonyDefinitions(DiffCeremonyDefinitionsRequest) returns (DiffCeremonyDefinitionsResponse);

  // Seat this session's roles. A definition says what a role does; it
  // does not say who plays it, and the same ceremony run twice can
  // seat different people. Answers with the session, like every other
  // move.
  rpc BindCeremonyParticipants(BindCeremonyParticipantsRequest) returns (BindCeremonyParticipantsResponse);

  // ---- Observability --------------------------------------------------

  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse);
}

// ============================================================================
// Core value objects
// ============================================================================

// A Task is the unit of work a council deliberates over.
// `description` is a free-form prompt; `attributes` is an opaque bag
// for use-case-specific structured data. `external_context` is a
// bounded, typed bundle of caller-materialized context that the
// choreographer can pass through to councils without turning it into
// one giant opaque blob.
message Task {
  string task_id = 1;
  string description = 2;
  string specialty = 3;
  Constraints constraints = 4;
  google.protobuf.Struct attributes = 5;
  ExternalContextBundle external_context = 6;
  TaskMetadata metadata = 7;
}

// Constraints shape how the council deliberates.
// `rubric` is opaque to the choreographer — passed verbatim to agents
// and validators as part of the deliberation context.
message Constraints {
  google.protobuf.Struct rubric = 1;
  uint32 rounds = 2; // peer-review rounds; 0 means implementation default
  uint32 num_agents = 3; // requested parallelism; 0 means use council size
  uint64 deadline_ms = 4; // optional soft deadline; 0 means none
  OutputContract output_contract = 5;
}

// Generic structured-output contract for one council invocation.
// Presence of this block switches deliberation into structured-output
// mode: callers require proposals to satisfy the declared format and
// field rules instead of remaining free-form text only.
//
// `json_schema`, when non-empty, is a JSON Schema document (draft
// 2020-12 or earlier, autodetected) that proposal outputs must
// satisfy. Field-level rules (`fields`) keep working alongside — they
// are the lightweight predecessor and remain useful for the simple
// "required + enum" case without a full schema. Concrete behaviour:
//
//  - empty `json_schema` + non-empty `fields` -> legacy field-rule
//    validators run (RequiredFieldsValidator, AllowedStringValuesValidator).
//  - non-empty `json_schema` -> the schema is parsed at validator wiring
//    time; every proposal output is validated against it as one extra
//    `ValidatorReport` ("json_schema" kind).
//  - both populated -> both run. Failure of either fails the proposal.
//
// Application-owned domain shapes (incident report, decision record,
// inspection finding, ...) are expressed as JSON Schemas in
// `api/examples/output-contracts/` and bound here by the caller.
message OutputContract {
  string contract_id = 1;
  OutputFormat format = 2;
  map<string, OutputFieldRule> fields = 3;
  string json_schema = 4;
}

enum OutputFormat {
  OUTPUT_FORMAT_UNSPECIFIED = 0;
  OUTPUT_FORMAT_JSON_OBJECT = 1;
}

message OutputFieldRule {
  bool required = 1;
  repeated string allowed_string_values = 2;
}

// Bounded, caller-materialized context bundle passed into a council.
// The contract is intentionally generic: callers define `item.kind`
// labels and attach machine-readable detail through `attributes`.
message ExternalContextBundle {
  string bundle_id = 1;
  string schema_version = 2;
  ContextSummary summary = 3;
  repeated ContextItem items = 4;
  repeated ContextReference references = 5;
  google.protobuf.Struct metadata = 6;
}

message ContextSummary {
  string text = 1;
  google.protobuf.Struct attributes = 2;
}

message ContextItem {
  string item_id = 1;
  string kind = 2;
  string title = 3;
  string narrative = 4;
  google.protobuf.Struct attributes = 5;
  repeated string reference_ids = 6;
}

message ContextReference {
  string reference_id = 1;
  string uri = 2;
  string title = 3;
  string media_type = 4;
  google.protobuf.Struct attributes = 5;
}

// Integration-neutral task metadata. Product/domain identifiers
// belong in Task.attributes or ExternalContextBundle.metadata; the
// choreographer only interprets causal ids and its own contract /
// execution hints.
message TaskMetadata {
  string source_event_id = 1;
  string causation_id = 2;
  string correlation_id = 3;
  string council_contract_id = 4;
  string output_contract_id = 5;
  google.protobuf.Struct execution_profile = 6;
}

// A single agent's output from one step of deliberation.
message Proposal {
  string proposal_id = 1;
  string author_agent_id = 2;
  string content = 3; // free-form solution artifact
  google.protobuf.Struct metadata = 4; // opaque per-agent annotations
  uint32 revision_count = 5; // peer-review revisions applied to this proposal
}

// Outcome of validating and scoring a proposal.
//
// `passed` is NOT stored: it is a pure projection of `reports` and
// MUST be computed by serializers as `reports.all(|r| r.passed)` if
// their wire format needs it. Having two sources of truth for pass /
// fail is a denormalization bug waiting to happen and is refused here.
message ValidationOutcome {
  double score = 1;
  repeated ValidatorReport reports = 2;
}

message ValidatorReport {
  // Free-form, adapter-defined kind (e.g. `"lint"`, `"policy"`,
  // `"dry-run"`, `"clinical-safety"`, `"fact-check"`).
  string kind = 1;
  bool passed = 2;
  string summary = 3;
  google.protobuf.Struct details = 4;
}

// A ranked deliberation result.
message DeliberationResult {
  Proposal proposal = 1;
  ValidationOutcome validation = 2;
  uint32 rank = 3; // 0 = winner
}

// Incremental update emitted during streaming deliberation.
message DeliberationUpdate {
  string task_id = 1;
  DeliberationPhase phase = 2;
  oneof payload {
    Proposal proposal = 10;
    Critique critique = 11;
    Revision revision = 12;
    ValidationOutcome validation = 13;
    DeliberationResult result = 14;
  }
  google.protobuf.Timestamp emitted_at = 20;
}

// Lifecycle phases of a deliberation. Matches the domain aggregate's
// 5-state FSM: Proposing → Revising → Validating → Scoring → Completed.
// There is no separate `CRITIQUING` phase — critique/revise rounds
// happen internally within `REVISING`.
enum DeliberationPhase {
  DELIBERATION_PHASE_UNSPECIFIED = 0;
  DELIBERATION_PHASE_PROPOSING = 1;
  DELIBERATION_PHASE_REVISING = 2;
  DELIBERATION_PHASE_VALIDATING = 3;
  DELIBERATION_PHASE_SCORING = 4;
  DELIBERATION_PHASE_COMPLETED = 5;
}

message Critique {
  string reviewer_agent_id = 1;
  string target_proposal_id = 2;
  string feedback = 3;
}

message Revision {
  string author_agent_id = 1;
  string proposal_id = 2;
  string updated_content = 3;
}

// ============================================================================
// Council / Agent
// ============================================================================

message CouncilSummary {
  string specialty = 1;
  uint32 num_agents = 2;
  repeated AgentSummary agents = 3; // optional; populated on request
  google.protobuf.Timestamp created_at = 4;
}

message AgentSummary {
  string agent_id = 1;
  string specialty = 2;
  string kind = 3; // adapter-defined, e.g. "vllm", "frontier", "rule", "human"
  google.protobuf.Struct attributes = 4;
}

// ============================================================================
// Triggers
// ============================================================================

// Opaque event instructing the choreographer to run deliberations.
// The event carries its own domain payload and the list of specialties
// whose councils should be dispatched.
message TriggerEvent {
  string event_id = 1;
  string kind = 2; // free-form, e.g. "alert.fired", "case.opened"
  string source = 3; // producer identifier
  google.protobuf.Timestamp emitted_at = 4;

  repeated string requested_specialties = 5;
  string task_description_template = 6; // optional literal task description supplied by the producer
  Constraints constraints = 7;

  google.protobuf.Struct payload = 8; // opaque domain data
  ExternalContextBundle external_context = 9;
  string correlation_id = 10;
  string causation_id = 11;
}

message ProcessTriggerEventRequest {
  TriggerEvent event = 1;
}

message ProcessTriggerEventResponse {
  TriggerAck ack = 1;
}

message TriggerAck {
  string event_id = 1;
  bool accepted = 2;
  repeated string dispatched_task_ids = 3;
  string reason = 4; // populated when accepted=false
}

// ============================================================================
// RPC request / response messages
// ============================================================================

message DeliberateRequest {
  Task task = 1;
}

message StreamDeliberationRequest {
  Task task = 1;
}

message StreamDeliberationResponse {
  DeliberationUpdate update = 1;
}

message DeliberateResponse {
  string task_id = 1;
  repeated DeliberationResult results = 2;
  string winner_proposal_id = 3;
  uint64 duration_ms = 4;
  google.protobuf.Struct metadata = 5;
}

message GetDeliberationResultRequest {
  string task_id = 1;
}

message GetDeliberationResultResponse {
  bool found = 1;
  DeliberateResponse result = 2;
}

message OrchestrateRequest {
  Task task = 1;
  google.protobuf.Struct execution_options = 2; // opaque for executor adapter
}

message OrchestrateResponse {
  string task_id = 1;
  string execution_id = 2;
  DeliberationResult winner = 3;
  repeated DeliberationResult candidates = 4;
  uint64 duration_ms = 5;
  google.protobuf.Struct metadata = 6;
}

message CreateCouncilRequest {
  string specialty = 1;
  uint32 num_agents = 2;
  google.protobuf.Struct agent_config = 3; // passed to agent factory
}

message CreateCouncilResponse {
  CouncilSummary council = 1;
}

message ListCouncilsRequest {
  bool include_agents = 1;
}

message ListCouncilsResponse {
  repeated CouncilSummary councils = 1;
}

message DeleteCouncilRequest {
  string specialty = 1;
}

message DeleteCouncilResponse {
  bool deleted = 1;
}

message RegisterAgentRequest {
  string specialty = 1;
  AgentSummary agent = 2;
  google.protobuf.Struct agent_config = 3;
}

message RegisterAgentResponse {
  string agent_id = 1;
}

message UnregisterAgentRequest {
  string agent_id = 1;
}

message UnregisterAgentResponse {
  bool unregistered = 1;
}

message GetStatusRequest {
  bool include_stats = 1;
}

message GetStatusResponse {
  string version = 1;
  uint64 uptime_seconds = 2;
  string health = 3; // "healthy" | "degraded" | "unhealthy"
  Statistics stats = 4;
}

message GetMetricsRequest {}

message GetMetricsResponse {
  Statistics stats = 1;
}

message Statistics {
  uint64 total_deliberations = 1;
  uint64 total_orchestrations = 2;
  uint64 total_duration_ms = 3;
  double average_duration_ms = 4;
  map<string, uint64> per_specialty_counts = 5;
}

// ============================================================================
// Council decision (Epic 9) — consumer-facing, contract-aware,
// no executor coupling.
// ============================================================================

message RunCouncilDecisionRequest {
  // Caller picks one of two ways to identify the council.
  oneof selector {
    string council_id = 1;
    string specialty = 2;
  }
  // Slug previously registered through RegisterContract or seeded
  // from CHOREO_CONTRACT_DIR. Must match an existing contract.
  string contract_id = 3;
  // Optional bundle the council can read during deliberation
  // (kernel rehydration output, retrieval results, etc.).
  ExternalContextBundle external_context = 4;
  // How strictly the response honours the contract. Defaults to
  // STRICT when UNSPECIFIED.
  ValidationMode validation_mode = 5;
  // Causal metadata the choreographer copies into the outbound
  // bus event when the deliberation completes.
  TaskMetadata metadata = 6;
  // Free-form task description the council reads as context. The
  // choreographer itself does not parse it.
  string description = 7;
}

enum ValidationMode {
  VALIDATION_MODE_UNSPECIFIED = 0;
  VALIDATION_MODE_STRICT = 1;
  VALIDATION_MODE_WARN = 2;
}

message CandidateSummary {
  string proposal_id = 1;
  string author_agent_id = 2;
  double score = 3;
  repeated ValidatorReport reports = 4;
  uint32 rank = 5;
  bool passed = 6;
  uint32 revision_count = 7;
}

message ValidationOutcomeSummary {
  // True iff the winning proposal passed every validator.
  bool passed = 1;
  // Number of candidates that passed every validator.
  uint32 candidates_passed = 2;
  // Total candidates considered for ranking.
  uint32 candidates_total = 3;
}

message RunCouncilDecisionResponse {
  string task_id = 1;
  // Winning proposal already validated when this message is built.
  DeliberationResult winner = 2;
  ValidationOutcomeSummary validation = 3;
  // Per-candidate breakdown, ordered by rank ascending.
  repeated CandidateSummary candidates = 4;
  uint64 duration_ms = 5;
  // Effective validation mode (echoed back so warned-but-returned
  // responses are unambiguous).
  ValidationMode validation_mode = 6;
}

// CRUD over the contract registry.

message RegisterContractRequest {
  OutputContract contract = 1;
}
message RegisterContractResponse {
  string contract_id = 1;
}

message ListContractsRequest {}
message ListContractsResponse {
  repeated OutputContract contracts = 1;
}

message DeleteContractRequest {
  string contract_id = 1;
}
message DeleteContractResponse {
  bool deleted = 1;
}

// ============================================================================
// Declarative ceremony execution
// ============================================================================

message RunCeremonyRequest {
  // Optional. When empty the server mints a ceremony id.
  string ceremony_id = 1;
  // Declarative ceremony definition in the YAML format accepted by
  // Choreographer's ceremony YAML adapter.
  string definition_yaml = 2;
  // Initial ceremony context. Guard approvals and use-case specific
  // structured data live here.
  google.protobuf.Struct context = 3;
  // Optional. Defaults to a server-owned runner id when empty.
  string lease_owner_id = 4;
  // Optional. Defaults to 60000ms when zero.
  uint64 lease_ttl_ms = 5;
}

message CeremonyStepExecution {
  string state_id = 1;
  string step_id = 2;
  string role_id = 3;
  string status = 4;
  uint32 attempt = 5;
  // The step's produced output — for a deliberating step, the winning
  // proposal's content. Lets a caller read the meeting's record (what each
  // role contributed) straight from the response. Empty for steps that
  // produce no textual output.
  string output = 6;
}

message RunCeremonyResponse {
  string ceremony_id = 1;
  string definition_name = 2;
  string definition_version = 3;
  string final_state = 4;
  bool completed = 5;
  repeated CeremonyStepExecution steps = 6;
  string mermaid_sequence = 7;
}

// ============================================================================
// Live ceremony state
// ============================================================================

// A step as it stands right now.
//
// Distinct from CeremonyStepExecution, which is the trace of a finished
// run: this is current state, and it can report a failure a completed
// trace would never contain.
message CeremonyStepState {
  string step_id = 1;
  string state_id = 2;
  string status = 3;
  uint32 attempt = 4;
  // Structured output produced so far. Empty for a step that has not
  // run or produces none.
  google.protobuf.Struct output = 5;
  // Why the step failed, when it did. Empty otherwise.
  string error = 6;
}

// A guard on an outgoing transition.
message CeremonyTransitionGuard {
  string name = 1;
  // "human" when only a person can satisfy it, "automated" otherwise.
  string kind = 2;
  bool satisfied = 3;
}

// A transition leaving the current state.
message CeremonyAvailableTransition {
  string trigger = 1;
  string to = 2;
  // Whether every guard holds, so the transition can be applied now.
  bool enabled = 3;
  repeated CeremonyTransitionGuard guards = 4;
}

// A human guard whose decision was postponed, with the reason.
message CeremonyGuardDeferralState {
  string guard_name = 1;
  string statement = 2;
  string reason = 3;
  // What would make the decision worth revisiting. A deferral without
  // this is a decision quietly dropped.
  repeated string reconsider_when = 4;
  string deferred_at = 5;
}

// Who an intervention is addressed to. Empty role_ids means the whole
// table rather than nobody, which is why the kind is explicit.
message CeremonyInterventionTargetState {
  // "table" or "roles".
  string kind = 1;
  repeated string role_ids = 2;
}

// A message inside an intervention: what was said, plus whatever
// structured data came with it.
message CeremonyInterventionMessage {
  string message = 1;
  google.protobuf.Struct details = 2;
}

// Where a follow-up intervention came from, when it was opened off the
// back of an earlier answer.
message CeremonyInterventionProvenanceState {
  string source_intervention_id = 1;
  string source_response_role_id = 2;
  string selected_role_id = 3;
}

message CeremonyInterventionResponseState {
  string role_id = 1;
  CeremonyInterventionMessage content = 2;
  // Serialized evidence pack attached to the answer, when one was.
  string evidence_pack = 3;
  string responded_at = 4;
}

// A topic opened inside a working session.
message CeremonyInterventionState {
  string intervention_id = 1;
  string kind = 2;
  string status = 3;
  string requested_by = 4;
  CeremonyInterventionTargetState target = 5;
  CeremonyInterventionMessage request = 6;
  // Absent unless this intervention was opened from another one.
  CeremonyInterventionProvenanceState provenance = 7;
  repeated CeremonyInterventionResponseState responses = 8;
  string created_at = 9;
  string updated_at = 10;
  // Empty while the intervention is still open.
  string closed_at = 11;
}

// Everything a caller needs to decide what to do next with a working
// session: where it is, what blocks it, and what it has recorded.
message CeremonyInstanceState {
  string ceremony_id = 1;
  string definition_name = 2;
  string definition_version = 3;
  // Digest of the published definition this instance is bound to.
  // Empty when it was started from a definition supplied for the run:
  // an instance that is not governed must not look governed.
  string bound_definition_digest = 4;
  string current_state = 5;
  bool completed = 6;
  // The next step ready to run. Empty when none is.
  string next_step_id = 7;
  // Guards blocking progress that only a person can satisfy. This is
  // the field a client turns into "waiting for you".
  repeated string waiting_for_human = 8;
  repeated CeremonyGuardDeferralState guard_deferrals = 9;
  repeated CeremonyAvailableTransition transitions = 10;
  repeated CeremonyStepState steps = 11;
  repeated CeremonyInterventionState interventions = 12;
  repeated string open_intervention_ids = 13;
  google.protobuf.Struct context = 14;
  // Who sits in each seat for this session, where anyone was seated.
  // A role absent here is played the way the definition says, which is
  // the usual case and not a lesser one.
  repeated CeremonyParticipantBindingState participant_bindings = 15;
}

message CeremonyParticipantBindingState {
  string role_id = 1;
  // The specialty the role's work is put to. A specialty is what the
  // engine resolves a council from, so this names the panel.
  string specialty = 2;
  string bound_at = 3;
}

message GetCeremonyInstanceRequest {
  string ceremony_id = 1;
}

// Each RPC owns its response type by convention, all wrapping the same
// state message so every way of reaching a working session describes it
// identically.
message GetCeremonyInstanceResponse {
  CeremonyInstanceState instance = 1;
}

message ListCeremonyInstancesRequest {}

message ListCeremonyInstancesResponse {
  repeated CeremonyInstanceState instances = 1;
}

message StartCeremonyRequest {
  // Identifier for the session about to exist. Required here, unlike
  // in the tool surface that mints one: a server that invents an id
  // gives a client no way to retry a start it never saw answered.
  string ceremony_id = 1;
  string definition_yaml = 2;
  google.protobuf.Struct context = 3;
}

message StartCeremonyResponse {
  CeremonyInstanceState instance = 1;
}

message StartPublishedCeremonyRequest {
  string ceremony_id = 1;
  // Name and version of an already-published definition. The instance
  // records the digest it resolved to, which is what makes it possible
  // to tell later whether what ran is still what is published.
  string ceremony = 2;
  string version = 3;
  google.protobuf.Struct context = 4;
}

message StartPublishedCeremonyResponse {
  CeremonyInstanceState instance = 1;
}

message RunCeremonyStepRequest {
  string ceremony_id = 1;
  string step_id = 2;
  // Who holds the step lease. Empty takes the server default.
  string lease_owner_id = 3;
  // Repeating a call with the same key must not run the step twice.
  // Empty mints a fresh key server-side, which is accepted but is the
  // same as asking for no guarantee: a retry will run the step again.
  string idempotency_key = 4;
  // Zero takes the server default.
  uint64 lease_ttl_ms = 5;
}

message RunCeremonyStepResponse {
  CeremonyInstanceState instance = 1;
}

message ApplyCeremonyTransitionRequest {
  string ceremony_id = 1;
  // The named trigger to fire. Which transitions are available right
  // now is in CeremonyInstanceState.transitions.
  string trigger = 2;
  // What kind of party is firing it: "human", "agent", "service" or
  // "engine".
  //
  // Declared by you, because only you know. Which seat may fire this
  // trigger comes from the definition, and that says which seat was
  // required — not what turned up to fill it. The engine writes down
  // what you declare here and infers nothing, so a transition fired by
  // an agent is recorded as an agent even where a human was expected.
  //
  // Refused when missing or unrecognised. A default would put a kind
  // in the journal that nobody chose.
  string actor_kind = 3;
}

message ApplyCeremonyTransitionResponse {
  CeremonyInstanceState instance = 1;
}

message ApproveCeremonyGuardRequest {
  string ceremony_id = 1;
  string guard_name = 2;
  // Who is letting it through. An approval that cannot name a seat is
  // a receipt asserting a human decision nobody can be shown to have
  // taken — the same objection the deferral below already answers for
  // what and why.
  string role_id = 3;
  // What kind of party filled that seat: "human", "agent", "service"
  // or "engine".
  //
  // Declared by you, because only you know. That this guard demands a
  // human approval says one was required, not that one turned up, and
  // an engine reading compliance off its own requirement would write
  // exactly the receipt it refuses to write.
  string role_kind = 4;
}

message ApproveCeremonyGuardResponse {
  CeremonyInstanceState instance = 1;
}

message DeferCeremonyGuardRequest {
  string ceremony_id = 1;
  string guard_name = 2;
  // Deferring is a decision, not a silence: what was decided, why,
  // and what would make it worth revisiting. All three are required,
  // because a deferral that records none of them is indistinguishable
  // from nobody having looked.
  string statement = 3;
  string reason = 4;
  repeated string reconsider_when = 5;
  // And who decided it. The fourth of the four, and the only one
  // nobody can reconstruct afterwards.
  string role_id = 6;
  // What kind of party filled that seat. Declared, never deduced.
  string role_kind = 7;
}

// Something this session produced that a reason can point at.
//
// Flat with a discriminator rather than a oneof, so it reads the same
// on the wire and in the tool JSON. Only the field its kind names is
// read; the rest are ignored.
message CeremonyRecordRefState {
  // "step", "agenda_item", "contribution", "guard_decision" or
  // "transition".
  string kind = 1;
  string step_id = 2;
  string agenda_item = 3;
  // The contribution's place among the answers to its item, or the
  // move's place in the session, counting from one.
  uint32 ordinal = 4;
  string guard_name = 5;
}

message AssertCeremonyReasonRequest {
  string ceremony_id = 1;
  // The seat saying so. Who may say what follows from what the claim
  // is about: only whoever decided something may say what decided
  // them, and only whoever did it may say how.
  string role_id = 2;
  CeremonyRecordRefState from = 3;
  CeremonyRecordRefState to = 4;
  // "chosen_because", "achieved_by", "follows_from",
  // "satisfies_constraint", "violates_constraint", "supersedes" or
  // "contradicts".
  //
  // "answers" is absent on purpose: it states the shape of the session
  // rather than anyone's judgement, and only the engine asserts it.
  string kind = 5;
  // The reason itself, in one line. Required — an edge asserting a
  // connection while declining to say how is a guess written down as a
  // fact. Whatever needs paragraphs belongs on the record it points at.
  string why = 6;
  // "high", "medium" or "low". No fourth for "not sure enough to say":
  // a caller who would reach for it can decline to make the claim.
  string confidence = 7;
}

message AssertCeremonyReasonResponse {
  CeremonyInstanceState instance = 1;
}

message DeferCeremonyGuardResponse {
  CeremonyInstanceState instance = 1;
}

message RequestCeremonyInterventionRequest {
  string ceremony_id = 1;
  // Empty mints one server-side.
  string intervention_id = 2;
  string role_id = 3;
  // What kind of party fills that seat: "human", "agent", "service" or
  // "engine".
  //
  // Declared by you, because only you know. The journal records who
  // asked the table for help, and an entry that cannot say whether a
  // person or an agent asked is not worth the write.
  //
  // Refused when missing or unrecognised. A default would put a kind
  // in the journal that nobody chose.
  string role_kind = 9;
  // "opinion", "investigation" or "action".
  string kind = 4;
  // Whom it is put to. Empty asks the whole table.
  repeated string target_role_ids = 5;
  string message = 6;
  google.protobuf.Struct details = 7;
  // Set when this item exists because of an answer to an earlier one,
  // so a reader can follow how the session got here.
  CeremonyInterventionProvenanceState provenance = 8;
}

message RequestCeremonyInterventionResponse {
  CeremonyInstanceState instance = 1;
}

message RespondToCeremonyInterventionRequest {
  string ceremony_id = 1;
  string intervention_id = 2;
  string role_id = 3;
  // What kind of party fills that seat: "human", "agent", "service" or
  // "engine".
  //
  // Declared by you, because only you know. A contribution weighed
  // later as precedent reads differently depending on whether a person
  // or an agent gave it, and this is the only place that can be said.
  //
  // Refused when missing or unrecognised. A default would put a kind
  // in the journal that nobody chose.
  string role_kind = 6;
  string message = 4;
  google.protobuf.Struct details = 5;
}

message RespondToCeremonyInterventionResponse {
  CeremonyInstanceState instance = 1;
}

message CloseCeremonyInterventionRequest {
  string ceremony_id = 1;
  string intervention_id = 2;
  string role_id = 3;
  // What kind of party fills that seat: "human", "agent", "service" or
  // "engine".
  //
  // Declared by you, because only you know. Closing an item is a
  // decision that it has been answered enough, and who made it reads
  // differently depending on what kind of party they were.
  //
  // Refused when missing or unrecognised. A default would put a kind
  // in the journal that nobody chose.
  string role_kind = 4;
}

message CloseCeremonyInterventionResponse {
  CeremonyInstanceState instance = 1;
}

// Gathering evidence needs a source to gather from, and the server
// ships without one: until an operator wires a CeremonyEvidenceSource
// adapter, this RPC answers NOT_FOUND rather than inventing a result.
// The call exists so the surface is whole and so the failure is a
// plain answer instead of a missing method.
message CollectCeremonyEvidenceRequest {
  string ceremony_id = 1;
  string intervention_id = 2;
  string role_id = 3;
  // What kind of party fills that seat: "human", "agent", "service" or
  // "engine".
  //
  // Declared by you, because only you know. This call answers the item
  // as well as fetching what backs the answer, so it is recorded the
  // same way a plain response is — and a response that cannot say
  // whether a person or an agent gave it is worth less to whoever
  // weighs it later.
  //
  // Refused when missing or unrecognised. A default would put a kind
  // in the journal that nobody chose.
  string role_kind = 7;
  // Where the evidence came from. It is recorded alongside the answer
  // so a reader can tell what was looked at, not only what was said.
  string source_id = 4;
  string query = 5;
  google.protobuf.Struct details = 6;
}

message CollectCeremonyEvidenceResponse {
  CeremonyInstanceState instance = 1;
}

// Where a finding points. The structure matches the in-process
// surface field for field, so one client can read either.
message CeremonyDraftFinding {
  // "error" blocks publication; "warning" describes a ceremony that
  // can stall without being invalid.
  string severity = 1;
  // The element at fault: kind plus the identifiers naming it.
  google.protobuf.Struct locus = 2;
  string message = 3;
}

message CeremonyDraftSummary {
  uint32 states = 1;
  uint32 initial_states = 2;
  uint32 terminal_states = 3;
  uint32 transitions = 4;
  uint32 steps = 5;
  uint32 guards = 6;
  uint32 roles = 7;
}

message ValidateCeremonyDraftRequest {
  string definition_yaml = 1;
}

message ValidateCeremonyDraftResponse {
  string ceremony = 1;
  string version = 2;
  bool publishable = 3;
  uint32 error_count = 4;
  uint32 warning_count = 5;
  repeated CeremonyDraftFinding findings = 6;
}

message ExplainCeremonyDraftRequest {
  string definition_yaml = 1;
}

message ExplainCeremonyDraftResponse {
  string ceremony = 1;
  string version = 2;
  bool publishable = 3;
  CeremonyDraftSummary summary = 4;
  // The explanation, in the order it should be read: what the draft
  // is, then what stops it, then what merely troubles it.
  repeated string narrative = 5;
}

message PublishCeremonyDefinitionRequest {
  string definition_yaml = 1;
}

// One side of a comparison: either a published version, named, or a
// document supplied for the occasion. A caller comparing what they
// are about to publish against what is published needs both.
message CeremonyDefinitionRef {
  // Set both to name a published version.
  string ceremony = 1;
  string version = 2;
  // Or set this instead to compare a document that is not published.
  string definition_yaml = 3;
}

message CeremonyDefinitionChange {
  // "added", "removed" or "altered".
  string kind = 1;
  // The element at issue: kind plus the identifiers naming it.
  google.protobuf.Struct locus = 2;
  // "carries" when a running session is unaffected, "strands" when it
  // could be left with nowhere to go.
  string impact = 3;
  // What changed about the element. The locus says which one.
  string detail = 4;
}

message BindCeremonyParticipantsRequest {
  string ceremony_id = 1;
  // Role id to specialty. Empty seating is refused: it would change
  // nothing and answering "done" to it would be a small lie.
  map<string, string> seating = 2;
}

message BindCeremonyParticipantsResponse {
  CeremonyInstanceState instance = 1;
}

message DiffCeremonyDefinitionsRequest {
  CeremonyDefinitionRef before = 1;
  CeremonyDefinitionRef after = 2;
}

message DiffCeremonyDefinitionsResponse {
  bool identical = 1;
  // True when at least one change could strand a running session. One
  // is enough: such a version is not one to adopt mid-flight, however
  // harmless everything else about it is.
  bool strands_running_sessions = 2;
  uint32 strand_count = 3;
  repeated CeremonyDefinitionChange changes = 4;
}

message PublishCeremonyDefinitionResponse {
  // "published", "already_published" or "version_occupied". Offering
  // the same content under a version already holding it is not an
  // error; offering different content under it is refused, and both
  // digests come back so the caller can see what differed.
  string outcome = 1;
  string ceremony = 2;
  string version = 3;
  string digest = 4;
  string published_digest = 5;
  string offered_digest = 6;
}
