[package]
name = "choreo-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["Tirso Garcia Ibañez"]
repository = "https://github.com/underpass-ai/underpass-choreographer"
description = "Stdio MCP (Model Context Protocol) adapter that exposes the Underpass Choreographer gRPC API to coding agents (Codex, Claude Desktop, …)."
keywords = ["mcp", "anthropic", "choreographer", "stdio"]
categories = ["command-line-utilities"]
publish = true
readme = "README.md"
include = [
    "src/**/*.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE*",
]

[lints]
workspace = true

[[bin]]
name = "choreo-mcp"
path = "src/main.rs"

[dependencies]
choreo-adapters = { workspace = true, optional = true }
choreo-app = { workspace = true, optional = true }
choreo-core = { workspace = true, optional = true }
choreo-embedded = { workspace = true, optional = true }
choreo-mcp-proto = { workspace = true, optional = true }
async-trait = { workspace = true }
futures = { workspace = true, optional = true }
prost-types = { workspace = true, optional = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true, optional = true }
tokio = { workspace = true }
tonic = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true }
uuid = { workspace = true, optional = true }
testcontainers = { version = "0.23", optional = true }

[features]
default = ["grpc"]
embedded = [
    "dep:choreo-adapters",
    "dep:choreo-app",
    "dep:choreo-core",
    "dep:choreo-embedded",
    "dep:uuid",
]
grpc = [
    "dep:choreo-mcp-proto",
    "dep:futures",
    "dep:prost-types",
    "dep:time",
    "dep:tonic",
]
container-tests = ["dep:testcontainers"]

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
