[package]
name = "choreo-e2e-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "End-to-end runner that drives the Choreographer over its public gRPC surface. Not shipped."
publish = false

[lints]
workspace = true

[[bin]]
name = "choreo-e2e-runner"
path = "src/main.rs"

# Provider-E2E runner: drives the vLLM agent adapter directly
# against a real vLLM endpoint (mTLS or bearer). Kept as a second
# binary so the compose/k8s runner that drives the choreographer
# stays trivial and network-free by design.
[[bin]]
name = "choreo-e2e-provider"
path = "src/bin/provider.rs"

# Stub-runtime sidecar for the stack E2E. Serves the choreographer's
# RuntimeExecutor a real gRPC peer to talk to without dragging the
# real underpass-runtime image into this repo's test path.
[[bin]]
name = "choreo-stub-runtime"
path = "src/bin/stub_runtime.rs"

# Stub-LLM sidecar for the stack E2E. Serves the choreographer's
# OpenAiAgent adapter an OpenAI-shaped Chat Completions endpoint
# that always returns a JSON Report payload, so the positive
# structured-output path can be exercised against
# `api/examples/output-contracts/report.schema.json` without a real
# provider in the test path.
[[bin]]
name = "choreo-stub-llm"
path = "src/bin/stub_llm.rs"

# Operator tool: run any ceremony YAML against a deployed Choreographer
# over gRPC and print the resulting state, per-step roles, and the
# rendered conversation diagram.
[[bin]]
name = "choreo-run-ceremony"
path = "src/bin/run_ceremony_file.rs"

[dependencies]
choreo-proto = { workspace = true }
choreo-core = { workspace = true }
choreo-adapters = { workspace = true, features = ["agent-vllm", "grpc", "nats", "runtime-grpc"] }
tokio = { workspace = true }
tonic = { workspace = true }
prost-types = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-nats = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
futures = { workspace = true }
jsonschema = { workspace = true }
axum = "0.7"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
