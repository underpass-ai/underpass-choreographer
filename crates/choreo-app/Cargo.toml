[package]
name = "choreo-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Application layer (use cases) for the Underpass Choreographer."

[lints]
workspace = true

[dependencies]
choreo-core = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
# Required, not decorative: `Attributes` is choreo-core's public shape
# for opaque payloads and it is a map of JSON values, so any crate that
# builds one needs this.
serde_json = { workspace = true }

[dev-dependencies]
mockall = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
tokio-test = { workspace = true }
tracing-subscriber = { workspace = true }
criterion = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "deliberate"
harness = false
