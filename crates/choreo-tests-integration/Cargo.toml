[package]
name = "choreo-tests-integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Integration tests for Choreographer adapters, backed by testcontainers-managed services. Not shipped."
publish = false

[lints]
workspace = true

[features]
# Opt-in: CI enables this feature to actually run the tests. Without
# the feature the crate compiles but exercises nothing, so `cargo
# test --workspace` stays fast and network-free.
container-tests = ["dep:testcontainers"]

[dependencies]
choreo-core = { workspace = true }
choreo-app = { workspace = true }
choreo-adapters = { workspace = true, features = ["grpc", "nats", "postgres", "runtime-grpc"] }
choreo-proto = { workspace = true }
# Tokio is always required for the in-process gRPC fixture; the
# postgres_fixture additionally needs testcontainers when the
# `container-tests` feature is on.
tokio = { workspace = true }
async-trait = { workspace = true }
async-nats = { workspace = true }
tonic = { workspace = true }
tokio-stream = { workspace = true }
testcontainers = { version = "0.23", optional = true }
# Used by `tls_fixture` to mint in-memory CA + server + client
# certificates for the TLS handshake integration tests. Lives in
# `[dependencies]` (not dev-dependencies) because `tls_fixture` is
# a `pub mod` re-used by `tests/` files and `publish = false` on
# this crate keeps it out of the production dep graph anyway.
# Default features include the `crypto` provider (ring-backed),
# which is what `KeyPair::generate()` needs.
rcgen = { version = "0.13", features = ["pem"] }

[dev-dependencies]
# Both backends at once, on purpose: the parity test is the only place
# that can compare what one MCP tool answers depending on how it
# reached the engine.
choreo-mcp = { workspace = true, features = ["grpc", "embedded"] }
choreo-embedded = { workspace = true }
async-nats = { workspace = true }
tokio = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
prost-types = { workspace = true }
testcontainers = "0.23"
